<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075968">
  <meta name="description" content="Explore Paul and Barnabas' first missionary journey through Acts 13–14 in an interactive English and Tamil Bible map game.">
  <title>Scripture Path Maze | Learn Bible with Fun</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <main id="game" class="game" data-lang="en">
    <section id="start-screen" class="start-screen">
      <div class="start-frame">
        <p class="kicker">LEARN BIBLE WITH FUN</p>
        <div class="compass" aria-hidden="true"><i></i></div>
        <h1>Scripture Path Maze</h1>
        <h2 id="tamil-title">வேதாகமப் பயணப் பாதை</h2>
        <p id="subtitle">Guide Paul and Barnabas through their first missionary journey.</p>
        <fieldset class="setup-card"><legend id="language-label">Language</legend><div class="segmented" id="language-buttons"><button class="active" data-lang="en" type="button">English</button><button data-lang="ta" type="button">தமிழ்</button></div></fieldset>
        <fieldset class="setup-card"><legend id="level-label">Choose a level</legend><div class="level-grid" id="level-buttons"><button class="active" data-level="easy" type="button"><b id="easy-name">Easy</b><small id="easy-note">Follow the outward route</small></button><button data-level="medium" type="button"><b id="medium-name">Medium</b><small id="medium-note">Match places and events</small></button><button data-level="hard" type="button"><b id="hard-name">Hard</b><small id="hard-note">Complete the return route</small></button></div></fieldset>
        <p class="source-note" id="source-note">Journey sequence checked against Acts 13–14.</p>
        <button id="start-button" class="primary" type="button">Begin the Journey</button>
      </div>
    </section>
    <section id="play-screen" class="play-screen hidden">
      <header class="hud">
        <div class="hud-title"><span class="journey-gem" aria-hidden="true"></span><strong id="game-title">Journey Map</strong></div>
        <div class="hud-stats"><div><strong id="progress-count">0 / 8</strong><span id="progress-label">Stops</span></div><div><strong id="score">0</strong><span id="score-label">Points</span></div><div><strong id="stars" aria-label="3 stars"><i></i><i></i><i></i></strong><span id="stars-label">Stars</span></div></div>
        <div class="progress-track"><i id="progress-bar"></i></div>
      </header>
      <div id="map" class="map" role="img" aria-label="Illustrated map of Paul and Barnabas' journey">
        <img src="assets/journey-map-controlled.webp" alt="Illustrated Mediterranean coast and Cyprus">
        <svg id="route-layer" viewBox="0 0 1000 667" preserveAspectRatio="none" aria-hidden="true"><path id="route-path"></path><path id="attempt-path"></path></svg>
        <div id="flags" aria-hidden="true"></div><div id="wrong-zone" aria-hidden="true"></div><div id="traveller" class="traveller" aria-hidden="true"></div><canvas id="fireworks" aria-hidden="true"></canvas>
      </div>
      <section class="mission-sheet">
        <div id="feedback-ribbon" class="feedback-ribbon" aria-live="polite"></div>
        <p class="mission-number" id="mission-number">JOURNEY STOP 1</p><h2 id="question"></h2><p class="reference" id="reference"></p><div id="answers" class="answers"></div><p id="feedback" class="sr-only" aria-live="polite"></p>
        <article id="learning-card" class="learning-card hidden"><div class="learning-seal" aria-hidden="true"></div><div><h3 id="learning-title"></h3><p id="learning-text"></p></div><button id="next-button" class="primary" type="button">Continue</button></article>
      </section>
    </section>
    <section id="finish-screen" class="finish-screen hidden"><div class="finish-compass" aria-hidden="true"></div><p class="kicker">JOURNEY COMPLETE</p><h2 id="finish-title">Route completed!</h2><div class="final-stars" id="final-stars" aria-label="Final stars"></div><p id="finish-score"></p><button id="again-button" class="primary" type="button">Play Again</button></section>
  </main>
  <script src="app.js?v=10"></script>
</body>
</html>
